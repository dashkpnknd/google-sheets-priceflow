<!doctype html><html lang="ru"><head><base target="_top"><style>body{font:14px Arial;padding:18px;color:#172b26;background:#f6f8f7}main{background:white;padding:20px;border-radius:16px;border:1px solid #dce5e1}h1{margin:0}p{line-height:1.45;color:#60716b}button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:#176756;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:wait}button.secondary{background:#e7f2ed;color:#176756}.message{margin-top:12px;font-size:12px;line-height:1.45;color:#176756}</style></head><body><main><h1>Каталог ru:Store</h1><p>Каталог поставщика пересобирается автоматически каждые 15 минут.</p><button id="setup" type="button">Сохранить и выполнить первую синхронизацию</button><button class="secondary" id="sync" type="button">Пересобрать каталог сейчас</button><div id="message" class="message"></div></main><script>const $=id=>document.getElementById(id),buttons=[$('setup'),$('sync')],msg=t=>$('message').textContent=t,busy=v=>buttons.forEach(x=>x.disabled=v),done=r=>{busy(false);msg(r.message||'Каталог обновлён.')},fail=e=>{busy(false);msg(e.message||'Не удалось обновить каталог.')};$('setup').onclick=()=>{busy(true);google.script.run.withSuccessHandler(done).withFailureHandler(fail).saveRuStoreCatalogSetup()};$('sync').onclick=()=>{busy(true);google.script.run.withSuccessHandler(done).withFailureHandler(fail).runRuStoreCatalogNow()};</script></body></html>
