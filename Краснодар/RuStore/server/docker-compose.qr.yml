services:
  telegram-qr-login:
    build: .
    command: ["python", "qr_login.py"]
    environment:
      TG_API_ID: ${TG_API_ID:?Set TG_API_ID only for the launch command}
      TG_API_HASH: ${TG_API_HASH:?Set TG_API_HASH only for the launch command}
    volumes:
      - telegram-session:/data
    restart: "no"

  krasnodar-snapshot:
    build: .
    command: ["python", "snapshot_server.py"]
    environment:
      TG_API_ID: ${TG_API_ID:?Set TG_API_ID only for the launch command}
      TG_API_HASH: ${TG_API_HASH:?Set TG_API_HASH only for the launch command}
      SNAPSHOT_SECRET: ${SNAPSHOT_SECRET:?Set SNAPSHOT_SECRET only for the launch command}
      REFRESH_SECONDS: "900"
      TG_HISTORY_LIMIT: "1000"
    volumes:
      - telegram-session:/data
    expose:
      - "8090"
    networks:
      - price_master
    restart: unless-stopped

volumes:
  telegram-session:

networks:
  price_master:
    external: true
    name: price-master_default
