<!doctype html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font: 14px Arial, sans-serif; margin: 16px; color: #202124; }
      button { background: #1a73e8; border: 0; border-radius: 4px; color: #fff; cursor: pointer; padding: 9px 12px; }
      button:disabled { background: #9aa0a6; cursor: wait; }
      .status { background: #f1f3f4; border-radius: 4px; line-height: 1.45; margin: 12px 0; padding: 10px; white-space: pre-wrap; }
      .error { color: #b3261e; }
    </style>
  </head>
  <body>
    <strong>Каталог AppleTrade</strong>
    <div id="status" class="status">Проверяю состояние…</div>
    <button id="install" onclick="install()">Включить автообновление каждые 15 минут</button>
    <script>
      const status = document.getElementById('status');
      const installButton = document.getElementById('install');
      function showSetup(setup) {
        const trigger = setup.hasTrigger ? 'Автообновление: включено (каждые 15 минут).' : 'Автообновление: не установлено.';
        const last = setup.last
          ? '\nПоследняя загрузка в таблицу: ' + new Date(setup.last.at).toLocaleString() + '\nSKU: ' + setup.last.total + '\nИсточники: ' + setup.last.sources.join(', ')
          : '\nУспешных загрузок в таблицу ещё нет.';
        status.className = 'status'; status.textContent = trigger + last;
      }
      function fail(error) { status.className = 'status error'; status.textContent = 'Ошибка: ' + error.message; installButton.disabled = false; }
      function install() {
        installButton.disabled = true; status.className = 'status'; status.textContent = 'Устанавливаю триггер и загружаю свежий каталог…';
        google.script.run.withSuccessHandler(() => google.script.run.withSuccessHandler(showSetup).withFailureHandler(fail).bkGetSetup())
          .withFailureHandler(fail).bkInstallAndRefresh();
      }
      google.script.run.withSuccessHandler(showSetup).withFailureHandler(fail).bkGetSetup();
    </script>
  </body>
</html>
