<!doctype html>
<html lang="ru"><head><base target="_top"><style>
:root{--ink:#172b26;--muted:#71817c;--line:#dce5e1;--brand:#176756;--soft:#eff7f4;--canvas:#f6f8f7;--danger:#a13e36}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--canvas);color:var(--ink);font:14px/1.4 Arial,sans-serif}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 10px 26px rgba(23,43,38,.06)}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{font-size:21px;letter-spacing:-.5px;margin:0}.badge{display:inline-flex;gap:6px;align-items:center;padding:6px 9px;border-radius:99px;background:#f6efe2;color:#8b641e;font-size:11px;font-weight:700}.badge.connected{background:#e8f5ef;color:#197052}.dot{width:6px;height:6px;border-radius:50%;background:#d79e37}.dot.ok{background:#25a276}.hint{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.45}label{display:block;margin:16px 0 0;font-size:12px;font-weight:700;letter-spacing:.03em}input{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:11px;padding:12px 13px;color:var(--ink);font:14px Arial,sans-serif}input:focus{outline:0;border-color:#55a58f;box-shadow:0 0 0 3px rgba(51,145,116,.14)}input::placeholder{color:#9aa7a2}.check{display:flex;gap:9px;align-items:flex-start;margin-top:16px;font-size:12px;line-height:1.4;letter-spacing:0}.check input{width:auto;margin:2px 0 0;padding:0;accent-color:var(--brand)}.button{width:100%;border:0;border-radius:11px;background:var(--brand);color:#fff;padding:13px;margin-top:21px;font-size:13px;font-weight:700;cursor:pointer}.button:hover{background:#0e5042}.button:disabled{opacity:.55;cursor:wait}.secondary{margin-top:10px;background:var(--soft);color:var(--brand)}.secondary:hover{background:#dcefe8}.notice{display:none;margin-top:14px;padding:10px 11px;border-radius:10px;font-size:12px;line-height:1.45}.notice.ok{display:block;background:#e8f5ef;color:#176c50}.notice.error{display:block;background:#fdf0ee;color:var(--danger)}.divider{height:1px;background:var(--line);margin:21px 0}.loader{display:none;margin:10px 2px 0;color:var(--muted);font-size:12px}.loader.show{display:block}
</style></head><body><main class="card"><div class="top"><h1>Каталог поставщика</h1><div class="badge" id="badge"><span class="dot" id="dot"></span><span id="state">Готово к запуску</span></div></div><p class="hint">Каталог полностью пересобирается из публичного канала. После подключения пересборка запускается автоматически примерно раз в 15 минут.</p><form id="setup"><label>Магазин | Город<input id="project" required placeholder="Например, Электросталь | Электросталь"></label><label>Публичный канал поставщика<input id="channel" required placeholder="@astoredirectprice"></label><button class="button" id="connect" type="submit">Подключить Telegram-канал</button></form><div id="notice" class="notice"></div><div class="divider"></div><button class="button secondary" id="sync" type="button">Пересобрать каталог сейчас</button><div id="loader" class="loader">Читаем канал и пересобираем каталог…</div></main><script>
const byId=id=>document.getElementById(id);const connectButton=byId('connect');const syncButton=byId('sync');function showNotice(text,type){const notice=byId('notice');notice.textContent=text;notice.className='notice '+type}function setBusy(isBusy){connectButton.disabled=isBusy;syncButton.disabled=isBusy;byId('loader').className=isBusy?'loader show':'loader'}function setConnected(){byId('state').textContent='Подключено';byId('badge').className='badge connected';byId('dot').className='dot ok'}function applySavedSettings(data){if(!data)return;if(data.project)byId('project').value=data.project;if(data.channel){byId('channel').value='@'+String(data.channel).replace(/^@/,'');setConnected()}syncButton.disabled=!data.connected}
// Prefill must never block either button.
google.script.run.withSuccessHandler(applySavedSettings).withFailureHandler(()=>{}).getTelegramCatalogSetup();
byId('setup').addEventListener('submit',event=>{event.preventDefault();setBusy(true);google.script.run.withSuccessHandler(result=>{setBusy(false);applySavedSettings(result);setConnected();showNotice(result.message||'Telegram-канал подключён. Первый импорт выполнен.','ok')}).withFailureHandler(error=>{setBusy(false);showNotice(error.message||'Не удалось подключить Telegram-канал.','error')}).saveTelegramCatalogSetup({project:byId('project').value,channel:byId('channel').value})});
syncButton.addEventListener('click',()=>{setBusy(true);google.script.run.withSuccessHandler(result=>{setBusy(false);setConnected();showNotice(result.message||'Пересборка каталога завершена.','ok')}).withFailureHandler(error=>{setBusy(false);showNotice(error.message||'Не удалось пересобрать каталог.','error')}).runTelegramCatalogNow()});
</script></body></html>
