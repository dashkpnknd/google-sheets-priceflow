<!doctype html><html lang="ru"><head><base target="_top"><style>:root{--ink:#172b26;--muted:#71817c;--line:#dce5e1;--brand:#176756;--soft:#eff7f4;--canvas:#f6f8f7;--danger:#a13e36}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--canvas);color:var(--ink);font:14px/1.4 Arial,sans-serif}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{margin:0;font-size:21px}.badge{padding:6px 9px;border-radius:99px;background:#f6efe2;color:#8b641e;font-size:11px;font-weight:700}.badge.ok{background:#e8f5ef;color:#197052}.hint{color:var(--muted);font-size:12px}label{display:block;margin-top:15px;font-size:12px;font-weight:700}input{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:11px;font:14px Arial}.button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}.secondary{background:var(--soft);color:var(--brand);margin-top:10px}.notice{display:none;margin-top:14px;padding:10px;border-radius:10px;font-size:12px}.notice.ok{display:block;background:#e8f5ef;color:#176c50}.notice.error{display:block;background:#fdf0ee;color:var(--danger)}.loader{display:none;margin-top:10px;color:var(--muted);font-size:12px}.loader.show{display:block}</style></head><body><main class="card"><div class="top"><h1>Яблочный Спас<br>Орск</h1><span class="badge" id="state">Ожидает токен</span></div><p class="hint">Каталог запрашивается напрямую у RM Group и пересобирается раз в 15 минут. Цена передаётся без наценки, пока правило не задано.</p><form id="setup"><label>Магазин | Город<input id="project" required value="Яблочный Спас | Орск"></label><label>API-токен RM Group<input id="token" required type="password" placeholder="Вставьте токен доступа"></label><button class="button" id="connect">Сохранить и выполнить первую синхронизацию</button></form><div class="notice" id="notice"></div><button class="button secondary" id="sync" type="button">Пересобрать каталог сейчас</button><div class="loader" id="loader">Получаем прайс RM Group…</div></main><script>const $=id=>document.getElementById(id),busy=x=>{$('connect').disabled=x;$('sync').disabled=x;$('loader').className=x?'loader show':'loader'},notice=(t,k)=>{$('notice').textContent=t;$('notice').className='notice '+k},apply=d=>{if(d.project)$('project').value=d.project;if(d.connected){$('state').textContent='Подключено';$('state').className='badge ok'}};google.script.run.withSuccessHandler(apply).getRMGroupCatalogSetup();$('setup').onsubmit=e=>{e.preventDefault();busy(true);google.script.run.withSuccessHandler(r=>{busy(false);apply(r);$('token').value='';notice(r.message,'ok')}).withFailureHandler(e=>{busy(false);notice(e.message,'error')}).saveRMGroupCatalogSetup({project:$('project').value,token:$('token').value})};$('sync').onclick=()=>{busy(true);google.script.run.withSuccessHandler(r=>{busy(false);apply(r);notice(r.message,'ok')}).withFailureHandler(e=>{busy(false);notice(e.message,'error')}).runRMGroupCatalogNow()};</script></body></html>
